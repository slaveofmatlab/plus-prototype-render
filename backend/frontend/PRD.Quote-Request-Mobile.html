<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>报价申请（手机端）</title>
  <style>
    :root {
      --sfa-primary: #1b766c;
      --sfa-primary-pressed: #003932;
      --sfa-text-primary: #000000;
      --sfa-text-secondary: #666666;
      --sfa-text-tertiary: #999999;
      --sfa-divider: #eeeeee;
      --sfa-bg-page: #f6f6f8;
      --sfa-bg-card: #ffffff;
      --sfa-bg-input: #f2f2f2;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --radius-card: 12px;
      --radius-input: 10px;
      --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; }
    html { -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(165deg, #c5cad3 0%, #9ca3af 45%, #6b7280 100%);
      color: var(--sfa-text-primary);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .hidden { display: none !important; }
    .phone-mock-wrap { flex: 0 0 auto; filter: drop-shadow(0 24px 48px rgba(0, 0, 0, 0.28)); }
    .phone-mock {
      position: relative;
      padding: 10px;
      border-radius: 44px;
      overflow: hidden;
      background: linear-gradient(165deg, #3f3f42 0%, #252527 35%, #1a1a1c 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), inset 0 -1px 0 rgba(0,0,0,0.35);
    }
    .phone-mock-earpiece {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 88px;
      height: 26px;
      background: #0d0d0f;
      border-radius: 14px;
      z-index: 5;
      pointer-events: none;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.06);
    }
    .phone-mock-side-btn {
      position: absolute;
      right: -3px;
      top: 120px;
      width: 4px;
      height: 56px;
      background: linear-gradient(90deg, #2a2a2c, #1f1f21);
      border-radius: 0 3px 3px 0;
      pointer-events: none;
      opacity: 0.9;
    }
    .phone-mock-side-btn--vol { top: 200px; height: 48px; }
    .phone-mock-screen {
      position: relative;
      width: 375px;
      max-width: calc(100vw - 48px);
      height: min(812px, calc(100dvh - 96px));
      max-height: calc(100dvh - 96px);
      overflow: hidden;
      background: var(--sfa-bg-page);
      border-radius: 34px;
      transform: translateZ(0);
      isolation: isolate;
      padding-top: 10px;
    }
    .screen-shell {
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .app-header {
      position: relative;
      z-index: 20;
      background: #fff;
      border-bottom: 1px solid var(--sfa-divider);
      padding-top: var(--safe-top);
      flex-shrink: 0;
    }
    .nav {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
    }
    .nav-title { font-size: 17px; font-weight: 650; }
    .nav-btn {
      min-width: 44px;
      height: 44px;
      border: none;
      background: transparent;
      font-size: 15px;
      color: var(--sfa-primary);
      cursor: pointer;
    }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px 10px;
      flex-wrap: wrap;
    }
    .status-tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-tag.doc { background: #eaf6f4; color: var(--sfa-primary); }
    .status-tag.mode { background: #f3f4f6; color: #374151; }
    .steps {
      display: flex;
      gap: 8px;
      padding: 0 12px 12px;
    }
    .step {
      flex: 1;
      border-radius: 999px;
      height: 34px;
      border: 1px solid var(--sfa-divider);
      background: #fff;
      color: var(--sfa-text-secondary);
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step.active {
      border-color: var(--sfa-primary);
      color: var(--sfa-primary);
      background: #eaf6f4;
      font-weight: 600;
    }
    .content-scroll {
      flex: 1;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 0, 0, 0.22) transparent;
    }
    .content-scroll::-webkit-scrollbar { width: 5px; }
    .content-scroll::-webkit-scrollbar-track { background: transparent; margin: 6px 0; }
    .content-scroll::-webkit-scrollbar-thumb {
      background-color: rgba(0, 0, 0, 0.22);
      border-radius: 5px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    .container { padding: 12px; }
    .card {
      background: var(--sfa-bg-card);
      border: 1px solid var(--sfa-divider);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 12px;
      margin-bottom: 12px;
    }
    .card-title { margin: 0 0 12px; font-size: 15px; font-weight: 650; }
    .hint { font-size: 12px; color: var(--sfa-text-secondary); line-height: 1.5; margin-top: 8px; }
    .field { margin-bottom: 10px; }
    .field:last-child { margin-bottom: 0; }
    .label { display: block; margin-bottom: 6px; color: var(--sfa-text-secondary); font-size: 13px; }
    .label.req::before { content: "*"; color: #ff4d4f; margin-right: 4px; }
    .input, .select, .textarea {
      width: 100%;
      border: none;
      border-radius: var(--radius-input);
      background: var(--sfa-bg-input);
      padding: 0 12px;
      color: var(--sfa-text-primary);
      font-size: 14px;
      outline: none;
    }
    .input, .select { height: 42px; }
    .textarea {
      min-height: 72px;
      padding-top: 10px;
      padding-bottom: 10px;
      resize: none;
      line-height: 1.5;
    }
    .input:focus, .select:focus, .textarea:focus {
      box-shadow: 0 0 0 1px var(--sfa-primary);
      background: #fff;
    }
    .readonly-box {
      min-height: 42px;
      display: flex;
      align-items: center;
      border-radius: var(--radius-input);
      background: #f7f7f8;
      color: var(--sfa-text-primary);
      padding: 0 12px;
      font-size: 14px;
      border: 1px solid #ececec;
    }
    .chip-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      min-height: 34px;
      border: 1px solid var(--sfa-divider);
      border-radius: 999px;
      padding: 0 12px;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      background: #fff;
      cursor: pointer;
    }
    .chip input { display: none; }
    .chip.active,
    .chip:has(input:checked) {
      border-color: var(--sfa-primary);
      color: var(--sfa-primary);
      background: #eaf6f4;
      font-weight: 600;
    }
    .multi-select {
      min-height: 42px;
      border-radius: var(--radius-input);
      background: var(--sfa-bg-input);
      padding: 8px 12px;
      outline: none;
    }
    .multi-select:focus,
    .multi-select:focus-within {
      box-shadow: 0 0 0 2px rgba(27, 118, 108, 0.12);
    }
    .multi-select-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 26px;
      cursor: pointer;
    }
    .multi-select-value {
      flex: 1;
      font-size: 14px;
      color: var(--sfa-text-primary);
      line-height: 1.5;
      word-break: break-word;
    }
    .multi-select-input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      color: var(--sfa-text-primary);
      font-size: 14px;
      line-height: 1.5;
    }
    .multi-select-input::placeholder {
      color: var(--sfa-text-tertiary);
    }
    .multi-select-arrow {
      color: var(--sfa-text-tertiary);
      font-size: 12px;
      flex-shrink: 0;
    }
    .multi-select-panel {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid #e5e7eb;
    }
    .multi-option {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--sfa-text-primary);
    }
    .multi-option input {
      width: 16px;
      height: 16px;
      accent-color: var(--sfa-primary);
    }
    .multi-empty {
      font-size: 12px;
      color: var(--sfa-text-tertiary);
      line-height: 1.6;
      padding: 2px 0;
    }
    .mode-row {
      border: 1px solid var(--sfa-divider);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      background: #fafafa;
    }
    .mode-row:last-child { margin-bottom: 0; }
    .mode-cat { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .mini { font-size: 12px; color: var(--sfa-text-tertiary); line-height: 1.6; }
    .detail-grid {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 4px 8px;
      align-items: center;
    }
    .detail-grid .k { color: var(--sfa-text-secondary); font-size: 12px; }
    .detail-grid .v { color: var(--sfa-text-primary); font-size: 12px; line-height: 1.5; word-break: break-word; }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .btn {
      min-width: 72px;
      height: 36px;
      border: 1px solid var(--sfa-divider);
      border-radius: 999px;
      background: #fff;
      color: var(--sfa-text-primary);
      font-size: 13px;
      cursor: pointer;
      padding: 0 14px;
    }
    .btn.primary {
      background: var(--sfa-primary);
      border-color: var(--sfa-primary);
      color: #fff;
    }
    .btn.primary:active { background: var(--sfa-primary-pressed); }
    .btn.ghost {
      background: #f8faf9;
      color: var(--sfa-primary);
      border-color: #cfe5e1;
    }
    .detail-item {
      border: 1px solid var(--sfa-divider);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      background: #fff;
    }
    .detail-item:last-child { margin-bottom: 0; }
    .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      margin-bottom: 8px;
    }
    .detail-title { font-size: 14px; font-weight: 600; color: #222; margin: 0; }
    .detail-head-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .detail-delete-btn {
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      color: #ff6565;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }
    .detail-delete-btn svg { width: 16px; height: 16px; }
    .detail-fold-icon {
      width: 20px;
      height: 20px;
      color: var(--sfa-text-tertiary);
      transition: transform .2s ease;
      flex-shrink: 0;
    }
    .detail-item.collapsed .detail-fold-icon { transform: rotate(-90deg); }
    .detail-summary {
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      background: #fafafa;
      padding: 8px;
      margin-bottom: 8px;
    }
    .detail-item:not(.collapsed) .detail-summary { display: none; }
    .detail-body { display: block; }
    .detail-item.collapsed .detail-body { display: none; }
    .detail-edit-row {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }
    .detail-edit-label {
      color: var(--sfa-text-secondary);
      font-size: 12px;
      line-height: 1.4;
    }
    .detail-edit-label.req::before { content: "*"; color: #ff4d4f; margin-right: 4px; }
    .detail-edit-input {
      width: 100%;
      min-height: 38px;
      border: none;
      border-radius: 10px;
      background: var(--sfa-bg-input);
      padding: 0 12px;
      color: var(--sfa-text-primary);
      font-size: 13px;
      outline: none;
    }
    .detail-edit-input:focus {
      box-shadow: 0 0 0 1px var(--sfa-primary);
      background: #fff;
    }
    .margin-summary-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .margin-summary-item {
      border: 1px solid #f0f0f0;
      border-radius: 10px;
      padding: 10px 12px;
      background: #fafafa;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .ms-label {
      font-size: 12px;
      color: var(--sfa-text-secondary);
      line-height: 1.4;
    }
    .ms-value {
      flex-shrink: 0;
      font-size: 14px;
      font-weight: 700;
      color: var(--sfa-primary);
    }
    .action-bar {
      display: flex;
      gap: 8px;
      padding: 12px;
      padding-bottom: calc(12px + var(--safe-bottom));
      background: rgba(255,255,255,0.98);
      border-top: 1px solid var(--sfa-divider);
      flex-shrink: 0;
    }
    .action-bar .btn { flex: 1; }
    .btn:disabled, .btn.primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .mode-scope {
      margin-top: 8px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--sfa-text-secondary);
      background: #f8fafa;
      border-radius: 8px;
      border: 1px solid #e8eeed;
    }
    .mode-scope-label { color: var(--sfa-text-primary); font-weight: 600; }
    .mode-scope-line { display: block; margin-top: 4px; }
    .mode-scope-line:first-child { margin-top: 0; }
    .mode-margin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .mode-margin-item {
      background: #fff;
      border: 1px solid var(--sfa-divider);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }
    .mode-margin-item .k { font-size: 11px; color: var(--sfa-text-tertiary); }
    .mode-margin-item .v { font-size: 14px; font-weight: 600; margin-top: 2px; color: var(--sfa-text-primary); }
    .mode-ref-block { margin-top: 10px; }
    .mode-ref-block .label {
      display: block;
      font-size: 12px;
      color: var(--sfa-text-secondary);
      margin-bottom: 4px;
    }
    .mode-ref-block .label.req::before { content: "* "; color: #e53935; }
    .mode-ref-block .select {
      width: 100%;
      height: 36px;
      border: 1px solid var(--sfa-divider);
      border-radius: 8px;
      padding: 0 10px;
      font-size: 13px;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="phone-mock-wrap">
    <div class="phone-mock">
      <div class="phone-mock-earpiece"></div>
      <div class="phone-mock-side-btn"></div>
      <div class="phone-mock-side-btn phone-mock-side-btn--vol"></div>
      <div class="phone-mock-screen">
        <div class="screen-shell">
          <header class="app-header">
            <div class="nav">
              <button class="nav-btn" type="button" onclick="goCancelList()">返回</button>
              <div class="nav-title" id="navTitle">报价申请</div>
              <span class="nav-btn" aria-hidden="true" style="visibility:hidden;pointer-events:none">返回</span>
            </div>
            <div class="status-bar">
              <span class="status-tag doc" id="docStatusTag">单据状态：新建</span>
              <span class="status-tag mode" id="oaStatusTag">OA：初始</span>
            </div>
            <div class="steps">
              <div class="step active" id="s1">1 基础信息</div>
              <div class="step" id="s2">2 品类与明细</div>
            </div>
          </header>

          <div class="content-scroll">
            <main class="container">
              <section id="panel1">
                <div class="card">
                  <h3 class="card-title">基础信息</h3>
                  <div class="field">
                    <label class="label req" for="opCompany">运营公司</label>
                    <select id="opCompany" class="select">
                      <option value="">请选择</option>
                      <option>丰厨(上海)供应链管理有限公司</option>
                      <option>丰厨(北京)供应链管理有限公司</option>
                    </select>
                  </div>
                  <div class="field">
                    <label class="label req" for="dealerCompany">经销商公司</label>
                    <select id="dealerCompany" class="select" disabled>
                      <option value="">请先选择运营公司</option>
                    </select>
                  </div>
                  <div class="field">
                    <label class="label req" for="quoteType">报价类型</label>
                    <select id="quoteType" class="select">
                      <option value="">请选择</option>
                      <option>常规报价</option>
                      <option>临采报价</option>
                      <option>临客询价</option>
                    </select>
                  </div>
                  <div class="field">
                    <label class="label" id="customerChannelLabel" for="customerChannel">客户渠道</label>
                    <select id="customerChannel" class="select">
                      <option value="">请选择</option>
                      <option>团餐及大众餐饮</option>
                      <option>酒店及高端餐饮</option>
                    </select>
                  </div>
                  <div class="field">
                    <label class="label req" for="customerType">客户类型</label>
                    <select id="customerType" class="select">
                      <option value="">请选择</option>
                    </select>
                  </div>
                  <div class="field">
                    <label class="label req" id="customerLabel">客户名称</label>
                    <div id="customerMultiWrap">
                      <div class="multi-select" id="customerMultiSelect" tabindex="0" role="combobox" aria-expanded="false">
                        <div class="multi-select-head" id="customerMultiHead">
                          <input class="multi-select-input" id="customerMultiInput" placeholder="请先选择客户渠道、客户类型" autocomplete="off" />
                          <span class="multi-select-arrow" id="customerMultiArrow">展开</span>
                        </div>
                        <div class="multi-select-panel hidden" id="customerMultiPanel"></div>
                      </div>
                    </div>
                    <input id="customerName" class="input hidden" placeholder="临客询价时手动输入客户名称" />
                    <div class="hint hidden" id="customerHint" aria-hidden="true"></div>
                  </div>
                  <div class="field">
                    <label class="label" id="projectLabel">项目点名称（选填）</label>
                    <div id="projectMultiWrap">
                      <div class="multi-select" id="projectMultiSelect" tabindex="0" role="combobox" aria-expanded="false">
                        <div class="multi-select-head" id="projectMultiHead">
                          <input class="multi-select-input" id="projectMultiInput" placeholder="请选择" autocomplete="off" />
                          <span class="multi-select-arrow" id="projectMultiArrow">展开</span>
                        </div>
                        <div class="multi-select-panel hidden" id="projectMultiPanel"></div>
                      </div>
                    </div>
                    <input id="projectSiteName" class="input hidden" placeholder="临客询价时手动输入项目点" />
                    <div class="hint hidden" id="projectHint" aria-hidden="true"></div>
                  </div>
                  <div class="field">
                    <label class="label req" for="quoteTitle">报价标题</label>
                    <input id="quoteTitle" class="input" placeholder="默认：客户名称+开始日期+结束日期+销售报价" />
                  </div>
                  <div class="field">
                    <label class="label req" for="quoteStart">报价开始日期</label>
                    <input id="quoteStart" class="input" type="date" />
                  </div>
                  <div class="field">
                    <label class="label req" for="quoteEnd">报价结束日期</label>
                    <input id="quoteEnd" class="input" type="date" />
                  </div>
                  <div class="field">
                    <label class="label" for="remark">备注（选填）</label>
                    <textarea id="remark" class="textarea" placeholder="请输入备注，最多 500 字"></textarea>
                  </div>
                </div>
              </section>

              <section id="panel2" class="hidden">
                <div class="card">
                  <h3 class="card-title">第一步摘要</h3>
                  <div class="detail-grid">
                    <div class="k">运营公司</div><div class="v" id="sumOp">-</div>
                    <div class="k">经销商公司</div><div class="v" id="sumDealer">-</div>
                    <div class="k">报价类型</div><div class="v" id="sumQuoteType">-</div>
                    <div class="k">客户</div><div class="v" id="sumCustomer">-</div>
                    <div class="k">报价标题</div><div class="v" id="sumTitle">-</div>
                    <div class="k">项目点</div><div class="v" id="sumProject">-</div>
                    <div class="k">客户渠道</div><div class="v" id="sumChannel">-</div>
                    <div class="k">客户类型</div><div class="v" id="sumCustType">-</div>
                    <div class="k">有效期</div><div class="v" id="sumRange">-</div>
                  </div>
                </div>

                <div class="card">
                  <h3 class="card-title">报价品类</h3>
                  <div class="chip-group" id="categoryGrid"></div>
                </div>

                <div class="card">

    function calcPurchaseBaseByMode(row) {
      const mkt = Number(row && row.market);
      const last = Number(row && row.lastSalesPrice);
      if (!Number.isFinite(mkt) && !Number.isFinite(last)) return null;
      const mode = String((row && row.purchaseBenchmarkMode) || "").trim();
      if (mode === "参考现客户价格") {
        if (Number.isFinite(last)) return last * 0.95;
        return Number.isFinite(mkt) ? mkt * 0.98 : null;
      }
      if (mode === "网站价格") return Number.isFinite(mkt) ? mkt * 1.0 : null;
      if (mode === "采购价格(有效且最低)") return Number.isFinite(mkt) ? mkt * 0.92 : null;
      return Number.isFinite(mkt) ? mkt * 0.98 : null;
    }
    function recalcRow(r) {
      const base = calcPurchaseBaseByMode(r);
      r.purchaseBase = base != null ? base.toFixed(2) : "";
      const add = Number(r.markupRate);
      if (!r.purchaseConfirmTouched && base != null) {
        const plus = Number.isFinite(add) ? add : 0;
        r.purchaseConfirm = (base + plus).toFixed(2);
      } else if (!r.purchaseConfirmTouched) {
        r.purchaseConfirm = "";
      }
      const pc = Number(r.purchaseConfirm);
      const rule = marginRule(r.cat1);
      const hi = rule && Number.isFinite(Number(rule.maxMargin)) ? Number(rule.maxMargin) : null;
      if (!r.salesConfirmTouched && Number.isFinite(pc) && hi != null) {
        r.salesConfirm = (pc * (1 + hi / 100)).toFixed(2);
      } else if (!r.salesConfirmTouched) {
        r.salesConfirm = "";
      }
      const sc = Number(r.salesConfirm);
      if (Number.isFinite(sc) && Number.isFinite(pc) && sc !== 0) r.confirmSalesMargin = (((sc - pc) / sc) * 100).toFixed(2) + "%";
      else r.confirmSalesMargin = "";
    }

    function aggregateConfirmGrossMarginRate(rows, predicate) {
      const matched = (rows || []).filter((r) => {
        const pc = Number(r.purchaseConfirm);
        const sc = Number(r.salesConfirm);
        if (!Number.isFinite(pc) || !Number.isFinite(sc) || sc <= 0) return false;
        return predicate ? predicate(r) : true;
      });
      if (!matched.length) return "—";
      let totalSales = 0;
      let totalDiff = 0;
      matched.forEach((r) => {
        const pc = Number(r.purchaseConfirm);
        const sc = Number(r.salesConfirm);
        totalSales += sc;
        totalDiff += (sc - pc);
      });
      if (!totalSales) return "—";
      return ((totalDiff / totalSales) * 100).toFixed(2) + "%";
    }

    function matchProductByNameHint(nameHint) {
      const kw = String(nameHint || "").trim();
      if (!kw) return null;
      let best = null;
      let bestScore = 0;
      MOCK_PRODUCTS.forEach((p) => {
        const candidates = [p.stdName, p.name, p.brand].filter(Boolean);
        candidates.forEach((c) => {
          const score = c.includes(kw) || kw.includes(c) ? Math.min(c.length, kw.length) : 0;
          if (score > bestScore) {
            bestScore = score;
            best = p;
          }
        });
      });
      return best;
    }
    function addEmptyDetailRow() {
      const modeErr = validateCategoryModesOnly();
      if (modeErr) return alert(modeErr);
      const preset = NEW_DETAIL_MOCK[newDetailMockIndex % NEW_DETAIL_MOCK.length];
      newDetailMockIndex += 1;
      const matched = matchProductByNameHint(preset.name);
      const row = {
        code: matched ? matched.code : ("NEW_" + Date.now() + "_" + detailRows.length),
        stdName: matched ? matched.stdName : "",
        brand: matched ? matched.brand : "",
        spec: matched ? matched.spec : "",
        cat1: matched ? matched.cat1 : "",
        market: matched ? matched.market : null,
        lastSalesPrice: matched && Number.isFinite(Number(matched.lastSalesPrice)) ? matched.lastSalesPrice : "",
        isYihai: matched ? !!matched.isYihai : false,
        name: preset.name || "",
        unit: matched ? (matched.spec.includes("kg") ? "袋" : "箱") : "",
        markupRate: "",
        purchaseBase: "",
        purchaseConfirm: "",
        salesConfirm: "",
        confirmSalesMargin: "",
        purchaseBenchmarkMode: matched && categoryModeState[matched.cat1] ? normalizeCategoryState(matched.cat1).mode : "",
        collapsed: false,
        purchaseConfirmTouched: false,
        salesConfirmTouched: false,
        supplyFlag: "是",
        collabMode: preset.collabMode || (matched && matched.collabMode) || "大仓配送"
      };
      detailRows.push(row);
      renderDetailList();
    }
    function goProductPickerPage() {
      const modeErr = validateCategoryModesOnly();
      if (modeErr) return alert(modeErr);
      savePageDraft();
      sessionStorage.setItem("quoteProductPickerContext", JSON.stringify({
        selectedCats: getSelectedCats(),
        selectedCodes: detailRows.map((x) => x.code).filter(Boolean)
      }));
      sessionStorage.setItem("quoteReturnToStep2", "1");
      location.href = "PRD.Quote-Request-Mobile-Select-Product.html";
    }
    function addProductsFromPicker(products) {
      const cats = getSelectedCats();
      const codes = new Set(detailRows.map((x) => x.code));
      (products || []).forEach((p) => {
        if (codes.has(p.code)) return;
        detailRows.push({
          ...p,
          name: p.name || p.stdName,
          unit: p.spec && p.spec.includes("kg") ? "袋" : "箱",
          markupRate: "",
          purchaseBase: "",
          purchaseConfirm: "",
          salesConfirm: "",
          confirmSalesMargin: "",
          purchaseBenchmarkMode: normalizeCategoryState(p.cat1).mode || "",
          collapsed: true,
          purchaseConfirmTouched: false,
          salesConfirmTouched: false,
          supplyFlag: "是",
          collabMode: p.collabMode || "大仓配送"
        });
        codes.add(p.code);
      });
      renderDetailList();
    }
    function savePageDraft() {
      sessionStorage.setItem("quoteApplyMobileDraft", JSON.stringify({
        step,
        form: {
          opCompany: $("opCompany").value,
          quoteType: $("quoteType").value,
          customerChannel: $("customerChannel").value,
          customerType: $("customerType").value,
          customerName: $("customerName").value,
          quoteTitle: $("quoteTitle").value,
          quoteStart: $("quoteStart").value,
          quoteEnd: $("quoteEnd").value,
          remark: $("remark").value
        },
        selectedCustomerIds,
        selectedProjects,
        quoteTitleManuallyEdited,
        categoryModeState,
        detailRows,
        stateSnapshot: { id: state.id, docStatus: state.docStatus, oaStatus: state.oaStatus }
      }));
    }
    function consumePageDraft() {
      const raw = sessionStorage.getItem("quoteApplyMobileDraft");
      if (!raw) return;
      try {
        const d = JSON.parse(raw);
        if (!d || typeof d !== "object") return;
        if (d.form) {
          if (d.form.opCompany != null) $("opCompany").value = d.form.opCompany;
          bindDealer();
          if (d.form.quoteType != null) $("quoteType").value = d.form.quoteType;
          if (d.form.customerChannel != null) $("customerChannel").value = d.form.customerChannel;
          populateCustomerTypeOptions();
          if (d.form.customerType != null) $("customerType").value = d.form.customerType;
          syncQuoteTypeUI();
          if (d.form.customerName != null) $("customerName").value = d.form.customerName;
          if (d.form.quoteTitle != null) $("quoteTitle").value = d.form.quoteTitle;
          if (d.form.quoteStart != null) $("quoteStart").value = d.form.quoteStart;
          if (d.form.quoteEnd != null) $("quoteEnd").value = d.form.quoteEnd;
          if (d.form.remark != null) $("remark").value = d.form.remark;
        }
        if (Array.isArray(d.selectedCustomerIds)) selectedCustomerIds = d.selectedCustomerIds;
        if (Array.isArray(d.selectedProjects)) selectedProjects = d.selectedProjects;
        if (typeof d.quoteTitleManuallyEdited === "boolean") quoteTitleManuallyEdited = d.quoteTitleManuallyEdited;
        categoryModeState = d.categoryModeState && typeof d.categoryModeState === "object" ? d.categoryModeState : {};
        detailRows = Array.isArray(d.detailRows) ? d.detailRows : [];
        if (d.stateSnapshot && typeof d.stateSnapshot === "object") {
          if (d.stateSnapshot.id != null) state.id = d.stateSnapshot.id;
          if (d.stateSnapshot.docStatus != null) state.docStatus = d.stateSnapshot.docStatus;
          if (d.stateSnapshot.oaStatus != null) state.oaStatus = d.stateSnapshot.oaStatus;
        }
        if (Number.isFinite(Number(d.step))) step = Number(d.step);
        renderCustomerMultiSelect();
        renderProjectMultiSelect();
      } catch (e) {
        // ignore malformed draft in prototype mode
      }
    }
    function consumePickerResult() {
      const raw = sessionStorage.getItem("quoteProductPickerResult");
      if (!raw) return;
      sessionStorage.removeItem("quoteProductPickerResult");
      try {
        const parsed = JSON.parse(raw);
        const list = Array.isArray(parsed && parsed.products) ? parsed.products : [];
        if (list.length) addProductsFromPicker(list);
      } catch (e) {
        // ignore malformed data in prototype mode
      }
    }
    function consumeReturnStepFlag() {
      if (sessionStorage.getItem("quoteReturnToStep2") === "1") {
        sessionStorage.removeItem("quoteReturnToStep2");
        step = 2;
      }
    }
    function goFinish() {
      const e2 = step === 1 ? validateBasic() : validateStep2();
      if (e2) return alert(e2);
      if (isDetailMode()) {
        alert('保存成功');
        return;
      }
      state.id = 'BF' + String(Date.now()).slice(-8);
      state.docStatus = '新建';
      step = 2;
      applyReadonly();
      alert('保存成功');
    }
    function goCancelList() {
      const listForIndex = "../../requirements/销售管理/报价申请/PRD.Quote-Request-List-Mobile.html";
      const listForSelf = "PRD.Quote-Request-List-Mobile.html";
      if (window.parent && window.parent !== window && typeof window.parent.openTab === "function") {
        window.parent.openTab("报价申请列表", listForIndex);
        return;
      }
      window.location.href = listForSelf;
    }

    function initBasic() {
      bindDealer();
      populateCustomerTypeOptions();
      $("opCompany").addEventListener("change", () => {
        bindDealer();
        updateQuoteTitle(false);
        refreshModeRows();
      });
      $("quoteType").addEventListener("change", syncQuoteTypeUI);
      $("customerName").addEventListener("input", () => updateQuoteTitle(false));
      $("customerChannel").addEventListener("change", () => {
        populateCustomerTypeOptions();
        $("customerType").value = "";
        clearCustomerSelection();
        refreshModeRows();
      });
      $("customerType").addEventListener("change", () => {
        if (!isAdhoc()) clearCustomerSelection();
        refreshModeRows();
      });
      $("quoteTitle").addEventListener("input", () => { quoteTitleManuallyEdited = true; });
      $("quoteStart").addEventListener("change", () => updateQuoteTitle(false));
      $("quoteEnd").addEventListener("change", () => updateQuoteTitle(false));
      const t = new Date();
      const iso = (d) => d.toISOString().slice(0, 10);
      $("quoteStart").value = iso(t);
      const end = new Date(t);
      end.setMonth(end.getMonth() + 1);
      $("quoteEnd").value = iso(end);
      $("opCompany").value = "丰厨(上海)供应链管理有限公司";
      bindDealer();
      $("quoteType").value = "常规报价";
      $("customerChannel").value = "团餐及大众餐饮";
      syncQuoteTypeUI();
      $("customerType").value = "团餐公司";
      selectedCustomerIds = ["c12"];
      renderCustomerMultiSelect();
      renderProjectMultiSelect();
      $("customerMultiHead").addEventListener("click", (e) => {
        if (isAdhoc()) return;
        if (e.target && e.target.id === "customerMultiInput") {
          openMultiPanel("customerMultiPanel", "customerMultiArrow", "customerMultiSelect");
          return;
        }
        toggleMultiPanel("customerMultiPanel", "customerMultiArrow", "customerMultiSelect");
        $("customerMultiInput").focus();
        $("customerMultiInput").select();
      });
      $("projectMultiHead").addEventListener("click", (e) => {
        if (isAdhoc()) return;
        if (e.target && e.target.id === "projectMultiInput") {
          openMultiPanel("projectMultiPanel", "projectMultiArrow", "projectMultiSelect");
          return;
        }
        toggleMultiPanel("projectMultiPanel", "projectMultiArrow", "projectMultiSelect");
        $("projectMultiInput").focus();
        $("projectMultiInput").select();
      });
      $("customerMultiInput").addEventListener("focus", () => openMultiPanel("customerMultiPanel", "customerMultiArrow", "customerMultiSelect"));
      $("customerMultiInput").addEventListener("input", () => {
        customerSearchKeyword = $("customerMultiInput").value.trim();
        renderCustomerMultiSelect();
        openMultiPanel("customerMultiPanel", "customerMultiArrow", "customerMultiSelect");
      });
      $("customerMultiInput").addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          customerSearchKeyword = "";
          renderCustomerMultiSelect();
          openMultiPanel("customerMultiPanel", "customerMultiArrow", "customerMultiSelect");
          e.preventDefault();
        }
      });
      $("projectMultiInput").addEventListener("focus", () => openMultiPanel("projectMultiPanel", "projectMultiArrow", "projectMultiSelect"));
      $("projectMultiInput").addEventListener("input", () => {
        projectSearchKeyword = $("projectMultiInput").value.trim();
        renderProjectMultiSelect();
        openMultiPanel("projectMultiPanel", "projectMultiArrow", "projectMultiSelect");
      });
      $("projectMultiInput").addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          projectSearchKeyword = "";
          renderProjectMultiSelect();
          openMultiPanel("projectMultiPanel", "projectMultiArrow", "projectMultiSelect");
          e.preventDefault();
        }
      });
      updateQuoteTitle(true);
      if (!Object.keys(categoryModeState).length) {
        ["米面油", "干调类"].forEach((cat) => {
          categoryModeState[cat] = { mode: PURCHASE_MODE_OPTIONS[0], refCustomer: "", refWebsite: "" };
        });
      }
      refreshStatusTags();
    }
    function escapeHtml(s) {
      return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function escapeAttr(s) {
      return String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    }
    initBasic();
    consumePageDraft();
    consumeReturnStepFlag();
    consumePickerResult();
    if (isDetailMode()) {
      state.loginRole = inferLoginRole();
      const preset = {
        id: state.id,
        docStatus: state.docStatus,
        oaStatus: state.oaStatus
      };
      if (state.id === 'BF202603180006') {
        Object.assign(preset, {
          quoteTitle: '北京某某高校食堂2026-03-062026-03-12销售报价',
          customerIds: ['c29'],
          projects: ['央厨-北京顺义项目'],
          opCompany: '丰厨(北京)供应链管理有限公司',
          quoteStart: '2026-03-06',
          quoteEnd: '2026-03-12'
        });
      }
      if (state.id === 'BF202603180002') {
        Object.assign(preset, {
          opCompany: '丰厨(北京)供应链管理有限公司',
          quoteTitle: '北京某某酒店2026-03-052026-04-05销售报价',
          customerIds: ['c2'],
          projects: ['北京-总部项目'],
          quoteStart: '2026-03-05',
          quoteEnd: '2026-04-05'
        });
      }
      loadMockDocument(preset);
      state.loginRole = inferLoginRole();
    } else {
      state.loginRole = inferLoginRole();
      updateStepUI();
      applyReadonly();
    }
  </script>
